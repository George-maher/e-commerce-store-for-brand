<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offers System Test</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <style>
        .swiper-pagination-bullet {
            background: white !important;
            opacity: 0.7 !important;
        }
        .swiper-pagination-bullet-active {
            background: white !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Sample offers data
        const sampleOffers = [
            {
                id: 'sample1',
                title: 'Summer Sale',
                description: 'Get up to 50% off on selected items',
                image: 'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1200&h=600&fit=crop',
                ctaText: 'Shop Now',
                ctaLink: '#'
            },
            {
                id: 'sample2',
                title: 'New Collection',
                description: 'Discover our latest arrivals',
                image: 'https://images.unsplash.com/photo-1445205170230-053b83016050?w=1200&h=600&fit=crop',
                ctaText: 'Explore',
                ctaLink: '#'
            },
            {
                id: 'sample3',
                title: 'Limited Edition',
                description: 'Exclusive designs for premium customers',
                image: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=1200&h=600&fit=crop',
                ctaText: 'Learn More',
                ctaLink: '#'
            }
        ];

        // Offers Slider Component
        function OffersSlider() {
            const [offers, setOffers] = useState(sampleOffers);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                // Initialize Swiper after component mounts
                const timer = setTimeout(() => {
                    if (window.Swiper) {
                        new window.Swiper('.offers-swiper', {
                            modules: [window.Swiper.Autoplay, window.Swiper.Navigation, window.Swiper.Pagination, window.Swiper.EffectFade],
                            effect: 'fade',
                            spaceBetween: 0,
                            slidesPerView: 1,
                            loop: true,
                            autoplay: {
                                delay: 5000,
                                disableOnInteraction: false,
                            },
                            navigation: {
                                nextEl: '.swiper-button-next',
                                prevEl: '.swiper-button-prev',
                            },
                            pagination: {
                                clickable: true,
                                el: '.swiper-pagination',
                                bulletClass: 'swiper-pagination-bullet',
                                bulletActiveClass: 'swiper-pagination-bullet-active',
                            },
                        });
                    }
                }, 100);

                return () => clearTimeout(timer);
            }, []);

            if (loading) {
                return (
                    <div className="w-full h-[60vh] md:h-[80vh] bg-gray-200 animate-pulse rounded-2xl" />
                );
            }

            return (
                <section className="w-full mb-8">
                    <div className="relative w-full h-[60vh] md:h-[80vh] overflow-hidden rounded-2xl">
                        <div className="swiper offers-swiper w-full h-full">
                            {offers.map((offer) => (
                                <div key={offer.id} className="swiper-slide">
                                    <div className="relative w-full h-full group">
                                        {/* Background Image */}
                                        <div className="absolute inset-0">
                                            <img
                                                src={offer.image}
                                                alt={offer.title}
                                                className="w-full h-full object-cover"
                                            />
                                            {/* Dark Overlay */}
                                            <div className="absolute inset-0 bg-black bg-opacity-40 group-hover:bg-opacity-50 transition-all duration-300" />
                                        </div>

                                        {/* Content */}
                                        <div className="relative z-10 h-full flex items-center justify-center">
                                            <div className="text-center px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto">
                                                <h2 className="text-3xl sm:text-4xl lg:text-6xl font-bold text-white mb-4 sm:mb-6 transform transition-all duration-500 group-hover:scale-105">
                                                    {offer.title}
                                                </h2>
                                                <p className="text-lg sm:text-xl lg:text-2xl text-white mb-6 sm:mb-8 max-w-2xl mx-auto opacity-90">
                                                    {offer.description}
                                                </p>
                                                {offer.ctaText && (
                                                    <a
                                                        href={offer.ctaLink || '#'}
                                                        className="inline-flex items-center px-6 sm:px-8 lg:px-10 py-3 sm:py-4 lg:py-4 bg-white text-gray-900 font-semibold rounded-full hover:bg-gray-100 transform transition-all duration-300 hover:scale-105 shadow-lg"
                                                    >
                                                        {offer.ctaText}
                                                        <svg
                                                            className="w-5 h-5 ml-2"
                                                            fill="none"
                                                            stroke="currentColor"
                                                            viewBox="0 0 24 24"
                                                        >
                                                            <path
                                                                strokeLinecap="round"
                                                                strokeLinejoin="round"
                                                                strokeWidth={2}
                                                                d="M13 7l5 5m0 0l-5 5m5-5H6"
                                                            />
                                                        </svg>
                                                    </a>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Custom Navigation Buttons */}
                        <div className="swiper-button-next !left-4 !right-auto !text-white !bg-white/20 !backdrop-blur-sm !w-12 !h-12 !rounded-full !border !border-white/30 hover:!bg-white/30 transition-all duration-300">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
                            </svg>
                        </div>
                        <div className="swiper-button-prev !right-4 !left-auto !text-white !bg-white/20 !backdrop-blur-sm !w-12 !h-12 !rounded-full !border !border-white/30 hover:!bg-white/30 transition-all duration-300">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                            </svg>
                        </div>

                        {/* Custom Pagination */}
                        <div className="swiper-pagination !bottom-6" />
                    </div>
                </section>
            );
        }

        // Admin Dashboard Component
        function AdminDashboard() {
            const [activeTab, setActiveTab] = useState('products');
            const [offers, setOffers] = useState(sampleOffers);

            const handleDeleteOffer = (id) => {
                if (confirm('Delete this offer?')) {
                    setOffers(prev => prev.filter(o => o.id !== id));
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 p-8">
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <div className="mb-8">
                            <div className="bg-white/80 backdrop-blur-lg rounded-2xl shadow-xl border border-white/20 p-6">
                                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                                    <div>
                                        <h1 className="text-3xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent mb-2">
                                            Admin Dashboard
                                        </h1>
                                        <p className="text-gray-600">Manage your products and offers</p>
                                    </div>
                                    <div className="flex items-center space-x-6">
                                        <div className="text-center">
                                            <div className="text-3xl font-bold text-blue-600">24</div>
                                            <div className="text-sm text-gray-500">Total Products</div>
                                        </div>
                                        <div className="text-center">
                                            <div className="text-3xl font-bold text-purple-600">{offers.length}</div>
                                            <div className="text-sm text-gray-500">Total Offers</div>
                                        </div>
                                    </div>
                                </div>

                                {/* Navigation Tabs */}
                                <div className="mt-6 border-b border-gray-200">
                                    <nav className="-mb-px flex space-x-8">
                                        <button
                                            onClick={() => setActiveTab('products')}
                                            className={`py-2 px-1 border-b-2 font-medium text-sm transition-colors duration-200 ${
                                                activeTab === 'products'
                                                    ? 'border-blue-500 text-blue-600'
                                                    : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                            }`}
                                        >
                                            <div className="flex items-center gap-2">
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                                                </svg>
                                                Products
                                            </div>
                                        </button>
                                        <button
                                            onClick={() => setActiveTab('offers')}
                                            className={`py-2 px-1 border-b-2 font-medium text-sm transition-colors duration-200 ${
                                                activeTab === 'offers'
                                                    ? 'border-purple-500 text-purple-600'
                                                    : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                            }`}
                                        >
                                            <div className="flex items-center gap-2">
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                                                </svg>
                                                Offers
                                            </div>
                                        </button>
                                    </nav>
                                </div>
                            </div>
                        </div>

                        {/* Dynamic Content */}
                        {activeTab === 'offers' ? (
                            <div className="bg-white/80 backdrop-blur-lg rounded-2xl shadow-xl border border-white/20 p-6">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6">Offers Management</h2>
                                
                                {/* Add Offer Form */}
                                <div className="mb-8 p-6 bg-gray-50 rounded-xl">
                                    <h3 className="text-lg font-semibold mb-4">Add New Offer</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <input
                                            type="text"
                                            placeholder="Offer Title"
                                            className="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                        />
                                        <input
                                            type="text"
                                            placeholder="CTA Text"
                                            className="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                        />
                                        <textarea
                                            placeholder="Description"
                                            className="md:col-span-2 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                            rows={3}
                                        />
                                        <input
                                            type="url"
                                            placeholder="Image URL"
                                            className="md:col-span-2 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                        />
                                    </div>
                                    <button className="mt-4 px-6 py-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-lg font-semibold hover:from-purple-600 hover:to-pink-600 transition-all duration-200">
                                        Add Offer
                                    </button>
                                </div>

                                {/* Existing Offers */}
                                <div>
                                    <h3 className="text-xl font-bold text-gray-800 mb-4">Existing Offers</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {offers.map((offer) => (
                                            <div key={offer.id} className="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
                                                <div className="aspect-video relative">
                                                    <img
                                                        src={offer.image}
                                                        alt={offer.title}
                                                        className="w-full h-full object-cover"
                                                    />
                                                    <div className="absolute top-2 right-2">
                                                        <button
                                                            onClick={() => handleDeleteOffer(offer.id)}
                                                            className="p-2 bg-red-500 text-white rounded-full hover:bg-red-600 transition-colors duration-200 shadow-lg"
                                                        >
                                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                            </svg>
                                                        </button>
                                                    </div>
                                                </div>
                                                <div className="p-4">
                                                    <h4 className="font-semibold text-lg text-gray-800 mb-2">{offer.title}</h4>
                                                    <p className="text-gray-600 text-sm mb-3">{offer.description}</p>
                                                    {offer.ctaText && (
                                                        <div className="text-sm text-blue-600">
                                                            CTA: {offer.ctaText} → {offer.ctaLink || '#'}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="bg-white/80 backdrop-blur-lg rounded-2xl shadow-xl border border-white/20 p-6">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6">Products Management</h2>
                                <div className="text-center py-12 text-gray-500">
                                    <svg className="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                                    </svg>
                                    <p>Product management interface would go here</p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Main App
        function App() {
            const [showAdmin, setShowAdmin] = useState(false);

            return (
                <div>
                    {/* Navigation */}
                    <nav className="bg-white shadow-lg">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16">
                                <div className="flex items-center">
                                    <h1 className="text-xl font-bold text-gray-800">E-Commerce Store</h1>
                                </div>
                                <div className="flex items-center space-x-4">
                                    <button
                                        onClick={() => setShowAdmin(!showAdmin)}
                                        className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                                    >
                                        {showAdmin ? 'View Store' : 'Admin Dashboard'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content */}
                    {showAdmin ? (
                        <AdminDashboard />
                    ) : (
                        <div>
                            <OffersSlider />
                            
                            {/* Products Section */}
                            <div className="max-w-6xl mx-auto px-4 py-8">
                                <header className="mb-8">
                                    <h1 className="text-4xl font-extrabold text-gray-900">Latest Drops</h1>
                                    <div className="h-1 w-20 bg-blue-600 rounded-full mt-3" />
                                    <p className="text-gray-600 mt-4">Check out our newest products</p>
                                </header>

                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                    {[1, 2, 3, 4, 5, 6, 7, 8].map((i) => (
                                        <div key={i} className="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200 hover:shadow-xl transition-shadow duration-300">
                                            <div className="aspect-square bg-gray-200">
                                                <img 
                                                    src={`https://images.unsplash.com/photo-${1500 + i}?w=400&h=400&fit=crop`}
                                                    alt={`Product ${i}`}
                                                    className="w-full h-full object-cover"
                                                />
                                            </div>
                                            <div className="p-4">
                                                <h3 className="font-semibold text-lg text-gray-800 mb-2">Product {i}</h3>
                                                <p className="text-gray-600 text-sm mb-3">Description for product {i}</p>
                                                <div className="flex justify-between items-center">
                                                    <span className="text-xl font-bold text-gray-900">${(i * 25 + 50)}</span>
                                                    <button className="px-3 py-1 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 transition-colors">
                                                        Add to Cart
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
