<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2ff" />
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g1)" />
  <g transform="translate(-150, -80)">
    <ellipse cx="600" cy="300" rx="700" ry="260" fill="url(#g2)" />
    <ellipse cx="1200" cy="600" rx="500" ry="200" fill="#fee2e2" opacity="0.06" />
    <ellipse cx="200" cy="700" rx="320" ry="140" fill="#dbeafe" opacity="0.06" />
  </g>

  <g opacity="0.06">
    <rect x="0" y="0" width="1600" height="900" fill="#000" filter="url(#grain)" />
  </g>

  <g fill="#ffffff" opacity="0.03">
    <circle cx="1400" cy="120" r="40" />
    <circle cx="1300" cy="220" r="24" />
    <circle cx="150" cy="140" r="34" />
  </g>
</svg>
